name: Deploy Standard Structure (Laravel in public_html)

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SERVER_IP: '72.61.210.213'
      SERVER_USER: 'root'
      TARGET_DIR: '/home/shaundjuacademy.com/public_html'
      # Make sure this matches your CyberPanel username for this domain!
      DOMAIN_USERNAME: 'shaun6841'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Composer Dependencies
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --no-scripts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM & Build Inertia React
        run: |
          npm install
          npm run build

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add Server to Known Hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3; do
            keyscan_error_file="$(mktemp)"

            if ssh-keyscan -T 30 -H ${{ env.SERVER_IP }} >> ~/.ssh/known_hosts 2>"$keyscan_error_file"; then
              rm -f "$keyscan_error_file"
              break
            fi

            echo "ssh-keyscan attempt $attempt failed:"
            cat "$keyscan_error_file"
            rm -f "$keyscan_error_file"

            if [ "$attempt" -eq 3 ]; then
              echo "Failed to fetch SSH host key for ${{ env.SERVER_IP }} after 3 attempts."
              exit 1
            else
              echo "ssh-keyscan attempt $attempt failed, retrying in 5 seconds..."
              sleep 5
            fi
          done
          chmod 600 ~/.ssh/known_hosts

      # ---------------------------------------------------------
      # SYNC: Move all Laravel files to public_html
      # ---------------------------------------------------------
      - name: Sync Project to Server
        run: |
          rsync -avz --delete \
          --exclude='.env' \
          --exclude='/storage/' \
          --exclude='/bootstrap/cache/' \
          --exclude='/.git/' \
          --exclude='/node_modules/' \
          ./ ${{ env.SERVER_USER }}@${{ env.SERVER_IP }}:${{ env.TARGET_DIR }}

      # ---------------------------------------------------------
      # POST-DEPLOYMENT
      # ---------------------------------------------------------
      - name: Run Artisan & Set Permissions
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_IP }}
          username: ${{ env.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ env.TARGET_DIR }}
            php artisan optimize:clear
            php artisan migrate --force

            # Create symbolic link for storage if it doesn't exist
            cd public
            if [ ! -L storage ]; then
              ln -sfn ../storage/app/public storage
            fi
            
            # Set ownership back to the CyberPanel user so it can access files
            chown -R ${{ env.DOMAIN_USERNAME }}:${{ env.DOMAIN_USERNAME }} ${{ env.TARGET_DIR }}